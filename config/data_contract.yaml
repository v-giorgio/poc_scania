# Contract for SCANIA Component X IDA 2024 source files.
# test_labels.csv is deliberately absent: the official challenge has no test labels.
files:
  train_tte:
    description: First Component X repair or right-censoring duration, one row per vehicle.
    required_columns:
      vehicle_id: {dtype: int, nullable: false, unique: true}
      length_of_study_time_step: {dtype: float, nullable: false, min_value: 0.0}
      in_study_repair: {dtype: int, nullable: false, allowed_values: [0, 1]}
    max_missing_rate: 0.0

  train_specifications:
    description: Vehicle specification categories, one row per vehicle.
    required_columns:
      vehicle_id: {dtype: int, nullable: false, unique: true}
      Spec_0: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_1: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_2: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_3: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_4: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_5: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_6: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_7: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
    max_missing_rate: 0.0

  train_operational_readouts:
    description: Irregular operational readings, multiple rows per vehicle.
    required_columns:
      vehicle_id: {dtype: int, nullable: false}
      time_step: {dtype: float, nullable: false, min_value: 0.0}
    feature_columns:
      prefix: "^(171|666|427|837|167|309|272|835|370|291|158|100|459|397)_\\d+$"
      dtype: float
      nullable: true
      max_missing_rate: 0.02
    unique_key: [vehicle_id, time_step]
    max_missing_rate: 0.05

  validation_labels:
    description: Official ordinal labels for the randomly selected validation readout.
    required_columns:
      vehicle_id: {dtype: int, nullable: false, unique: true}
      class_label: {dtype: int, nullable: false, allowed_values: [0, 1, 2, 3, 4]}
    max_missing_rate: 0.0

  validation_specifications:
    description: Vehicle specification categories, one row per validation vehicle.
    required_columns:
      vehicle_id: {dtype: int, nullable: false, unique: true}
      Spec_0: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_1: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_2: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_3: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_4: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_5: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_6: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_7: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
    max_missing_rate: 0.0

  validation_operational_readouts:
    description: Validation readouts available through the supplied random cutoff.
    required_columns:
      vehicle_id: {dtype: int, nullable: false}
      time_step: {dtype: float, nullable: false, min_value: 0.0}
    feature_columns:
      prefix: "^(171|666|427|837|167|309|272|835|370|291|158|100|459|397)_\\d+$"
      dtype: float
      nullable: true
      max_missing_rate: 0.02
    unique_key: [vehicle_id, time_step]
    max_missing_rate: 0.05

  test_specifications:
    description: Vehicle specification categories, one row per test vehicle.
    required_columns:
      vehicle_id: {dtype: int, nullable: false, unique: true}
      Spec_0: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_1: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_2: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_3: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_4: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_5: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_6: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
      Spec_7: {dtype: str, nullable: false, pattern: "^Cat\\d+$"}
    max_missing_rate: 0.0

  test_operational_readouts:
    description: Test readouts available through the supplied random cutoff.
    required_columns:
      vehicle_id: {dtype: int, nullable: false}
      time_step: {dtype: float, nullable: false, min_value: 0.0}
    feature_columns:
      prefix: "^(171|666|427|837|167|309|272|835|370|291|158|100|459|397)_\\d+$"
      dtype: float
      nullable: true
      max_missing_rate: 0.02
    unique_key: [vehicle_id, time_step]
    max_missing_rate: 0.05

class_label_semantics:
  source: papers/2024_IDA_challenge_v2.pdf, Evaluation section
  description: Class 0 means no imminent event within 48 time units; classes 1-4 are windows before first Component X failure.
  units: anonymized time_step units; do not convert to calendar time or distance.
  windows:
    1: "24 < residual_time < 48"
    2: "12 < residual_time < 24"
    3: "6 < residual_time < 12"
    4: "0 < residual_time < 6"
  boundary_policy: Unknown; exact boundaries are excluded from derived training labels.
  censored_class_0_policy: Require more than 48 observed residual time units without an event; exact boundary remains unknown.
